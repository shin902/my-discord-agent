services:
  memory-core:
    image: agentmemory/memory-core:1.0.1
    restart: unless-stopped
    # The local CLIProxyAPI listens on host loopback (127.0.0.1:8317).
    # Host networking lets MemoryCore reach it without exposing CLIProxyAPI
    # on the LAN. Keep the MemoryCore gateway loopback-only below.
    network_mode: host
    environment:
      TDAI_GATEWAY_CONFIG: /data/config/tdai-gateway.yaml
      TDAI_GATEWAY_HOST: 127.0.0.1
      TDAI_GATEWAY_PORT: ${MEMORY_CORE_PORT:-8420}
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:-}
      TDAI_LLM_API_KEY: ${MEMORY_CORE_LLM_API_KEY:?MEMORY_CORE_LLM_API_KEY is required}
      TDAI_DATA_DIR: /data/tdai-memory
    volumes:
      - ./config/memory-core.yaml:/data/config/tdai-gateway.yaml:ro
      - memory-core-data:/data/tdai-memory

volumes:
  memory-core-data:
