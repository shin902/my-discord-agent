services:
  memory-core:
    image: "${MEMORY_CORE_IMAGE:-agentmemory/memory-core:1.0.1}"
    restart: unless-stopped
    # Host networking also supports an optional host-local CLIProxyAPI at
    # 127.0.0.1:8317 without exposing that proxy on the LAN. Direct or remote
    # OpenAI-compatible providers continue to work with this sidecar too.
    # Keep the MemoryCore gateway loopback-only below.
    network_mode: host
    environment:
      TDAI_GATEWAY_CONFIG: /data/config/tdai-gateway.yaml
      TDAI_GATEWAY_HOST: 127.0.0.1
      TDAI_GATEWAY_PORT: ${MEMORY_CORE_PORT:-8420}
      TDAI_GATEWAY_API_KEY: ${MEMORY_CORE_GATEWAY_API_KEY:-}
      # TDAI_LLM_API_BASE_URL is the operator-facing variable; MemoryCore
      # consumes the upstream TDAI_LLM_BASE_URL name internally.
      TDAI_LLM_BASE_URL: ${TDAI_LLM_API_BASE_URL:-https://api.openai.com/v1}
      TDAI_LLM_API_KEY: ${MEMORY_CORE_LLM_API_KEY:?MEMORY_CORE_LLM_API_KEY is required}
      # Embeddings are opt-in. `none` keeps the sidecar usable with LLM-only
      # proxies; `openai` expects the configured model's exact dimensions.
      TDAI_EMBEDDING_PROVIDER: ${MEMORY_CORE_EMBEDDING_PROVIDER:-none}
      TDAI_EMBEDDING_API_BASE_URL: ${MEMORY_CORE_EMBEDDING_API_BASE_URL:-https://api.openai.com/v1}
      TDAI_EMBEDDING_API_KEY: ${MEMORY_CORE_EMBEDDING_API_KEY:-}
      TDAI_EMBEDDING_MODEL: ${MEMORY_CORE_EMBEDDING_MODEL:-text-embedding-3-small}
      TDAI_DATA_DIR: /data/tdai-memory
    volumes:
      - ./config/memory-core.yaml:/data/config/tdai-gateway.yaml:ro
      - memory-core-data:/data/tdai-memory

volumes:
  memory-core-data:
