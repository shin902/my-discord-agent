name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome format check
        run: pnpm format:check

      - name: Biome lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Build Tool Runtime
        run: pnpm build:tool-runtime

      - uses: docker/setup-buildx-action@v3

      - name: Build Tool Runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.tool-runtime
          push: false
          load: true
          tags: my-discord-agent-tool-runtime:ci
          cache-from: type=gha,scope=tool-runtime
          cache-to: type=gha,mode=max,scope=tool-runtime
          progress: plain

      - name: Build Agent Runner
        run: pnpm build:runner

      - name: Build Agent Runner image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile
          push: false
          load: true
          tags: my-discord-agent-runner:ci
          cache-from: type=gha,scope=agent-runner
          cache-to: type=gha,mode=max,scope=agent-runner
          progress: plain

      - name: Test
        env:
          DOTENV_CONFIG_PATH: /dev/null
          TOOL_RUNTIME_TEST_IMAGE: my-discord-agent-tool-runtime:ci
          SANDBOX_NETWORK_TEST_IMAGE: my-discord-agent-runner:ci
        run: pnpm test
