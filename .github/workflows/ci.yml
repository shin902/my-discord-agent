name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Biome format check
        run: pnpm format:check

      - name: Biome lint
        run: pnpm lint

      - name: Type check
        run: pnpm typecheck

      - name: Test
        shell: bash
        run: |
          set +e
          pnpm test > /tmp/test.log 2>&1
          status=$?
          tail -n 240 /tmp/test.log
          exit $status
