name: Temporary branch formatter

on:
  push:
    branches: [feat/cache-stable-time-awareness]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: feat/cache-stable-time-awareness
      - uses: pnpm/action-setup@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec biome format --write src/agent/session.test.ts src/sandbox/agent-runner.ts src/time/context.test.ts
      - name: Commit formatting
        run: |
          if git diff --quiet; then exit 0; fi
          git config user.name github-actions[bot]
          git config user.email 41898282+github-actions[bot]@users.noreply.github.com
          git add src/agent/session.test.ts src/sandbox/agent-runner.ts src/time/context.test.ts
          git commit -m "style: format time awareness changes"
          git push origin HEAD:feat/cache-stable-time-awareness
